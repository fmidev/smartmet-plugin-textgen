# ----------------------------------------------------------------------
# Marine (merivaroitusalueet) forecast: wind_overview + weather_forecast_at_sea
# Mirrors the production configuration in run-products-textgen
# cnf/marine/marine.inc and marine_12_12.cnf (period 12 -> 12 next day).
# ----------------------------------------------------------------------

misc:
{
	timeformat	= "iso";
	language	= "fi";
	formatter	= "plainlines";
};

area:
{
	timezone:
	{
		default = "Europe/Helsinki";
	};
	marine:
	{
		default = true;
	};
};

mask:
{
	land	= "Finland";
	coast	= "maps/merialueet/rannikko.svg:10";
};

output_document:
{
	sections = ["title","part1"];

	title:
	{
		period: { type = "now"; };
		content = "none";
		header:
		{
			type	= "report_area";
			colon	= true;
			compact	= true;
			date	= false;
			time	= false;
			utc	= false;
			html: { level = 3; };
		};
	};

	part1:
	{
		period:
		{
			type		= "from_until";
			startday	= 0;
			starthour	= 12;
			endhour		= 12;
			switchhour	= 23;
			days		= 1;
		};
		header: { type = "none"; };
		content = ["wind_overview","weather_forecast_at_sea"];
		story:
		{
			wind_overview:
			{
				weekdays = false;
				night: { starthour = 18; maxstarthour = 23; endhour = 5; };
				day:   { starthour = 6;  maxstarthour = 15; endhour = 18; };

				max_error_wind_speed		= 2.0;
				max_error_wind_direction	= 20.0;
				wind_speed_threshold		= 3.5;
				wind_speed_warning_threshold	= 10.0;
				wind_direction_threshold	= 66.25;
				wind_direction_min_speed	= 5.5;
				wind_calc_top_share		= 80.0;
				wind_calc_top_share_weak	= 50.0;
				wind_speed_top_coverage		= 98.0;
				wind_speed_interval_min_size	= 2;
				wind_speed_interval_max_size	= 5;

				# Optional: report intermediate wind speeds inside a change only when the
				# wind is at warning level. 0 = report all (library default). The tests
				# override this per request with wind_speed_intermediate_report_limit=10.
				wind_speed_intermediate_report_limit = 0.0;

				convective_cell_cutoff		= 14;
				convective_cell_max_duration	= 6;
				convective_cell_max_area_fraction = 25;
				convective_cell_style		= "quadrant";
				convective_cell_reporting	= false;
			};
			weather_forecast_at_sea:
			{
				weekdays = false;
				short_text_mode = false;
				night: { starthour = 18; maxstarthour = 23; endhour = 6; };
				day:   { starthour = 6;  maxstarthour = 15; endhour = 18; };

				dry_weather_limit	= 0.0125; // mm/h
				generally_limit		= 90;	// percentage
				someplaces_limit	= 10;	// percentage
				manyplaces_limit	= 50;	// percentage
				in_some_places_upper_limit = 90;

				summertime: { startdate = "0401"; enddate = "0930";
					      thunder: { normal_extent_min = 5; normal_extent_max = 30; }; };
				wintertime: { thunder: { normal_extent_min = 10; normal_extent_max = 30; }; };
				thunder:
				{
					small_probability_min	= 20;
					small_probability_max	= 30;
					normal_probability_min	= 30;
					normal_probability_max	= 60;
				};
			};
		};
	};
};

unit_format:
{
	celsius		= "SI";
	meterspersecond	= "SI";
	millimeters	= "SI";
	percent		= "phrase";
};

querydata:
{
	pal_skandinavia_pintahistoria = "/usr/share/smartmet/test/data/pal/";
};

forecast_data:
{
	default_forecast = "use querydata.pal_skandinavia_pintahistoria";
};
