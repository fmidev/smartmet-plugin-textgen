# ----------------------------------------------------------------------
# Marine (merivaroitusalueet) forecast: wind_sea_overview + weather_forecast_at_sea
# Mirrors the production configuration in run-products-textgen
# cnf/marine/marine.inc and marine_12_12.cnf (period 12 -> 12 next day).
# ----------------------------------------------------------------------

misc:
{
	timeformat	= "iso";
	language	= "fi";
	formatter	= "plainlines";
};

area:
{
	timezone:
	{
		default = "Europe/Helsinki";
	};
	marine:
	{
		default = true;
	};
};

mask:
{
	land	= "Finland";
	coast	= "maps/merialueet/rannikko.svg:10";
};

output_document:
{
	sections = ["title","part1"];

	title:
	{
		period: { type = "now"; };
		content = "none";
		header:
		{
			type	= "report_area";
			colon	= true;
			compact	= true;
			date	= false;
			time	= false;
			utc	= false;
			html: { level = 3; };
		};
	};

	part1:
	{
		period:
		{
			type		= "from_until";
			startday	= 0;
			starthour	= 12;
			endhour		= 12;
			switchhour	= 23;
			days		= 1;
		};
		header: { type = "none"; };
		content = ["wind_sea_overview","weather_forecast_at_sea"];
		story:
		{
			wind_sea_overview:
			{
				# Change detection on the time-smoothed area mean wind
				speed_change_threshold	= 3.0;
				weak_wind_limit		= 4.0;
				smoothing_hours		= 3;
				max_changes		= 3;
				gradual_hours		= 8;
				fast_hours		= 3;
				fast_change		= 5.0;

				# Reported range from spatial percentiles around the mean
				range_lower_percentile	= 25;
				range_upper_percentile	= 75;
				range_min_width		= 2;
				range_max_width		= 5;
				range_hours		= 3;
				range_report_min_difference = 2;

				# Direction
				direction_change_threshold	= 45;
				direction_variable_max_speed	= 6.0;
				direction_split_min_hours	= 6;
				wind_direction: { accurate_limit = 22.5; variable_limit = 45; };
				turn_phrases = "plain";

				# Gusts only in a separate sentence when enabled
				gust_reporting	= false;
				gust_limit	= 15;
			};
			weather_forecast_at_sea:
			{
				weekdays = false;
				short_text_mode = false;
				night: { starthour = 18; maxstarthour = 23; endhour = 6; };
				day:   { starthour = 6;  maxstarthour = 15; endhour = 18; };

				dry_weather_limit	= 0.0125; // mm/h
				generally_limit		= 90;	// percentage
				someplaces_limit	= 10;	// percentage
				manyplaces_limit	= 50;	// percentage
				in_some_places_upper_limit = 90;

				summertime: { startdate = "0401"; enddate = "0930";
					      thunder: { normal_extent_min = 5; normal_extent_max = 30; }; };
				wintertime: { thunder: { normal_extent_min = 10; normal_extent_max = 30; }; };
				thunder:
				{
					small_probability_min	= 20;
					small_probability_max	= 30;
					normal_probability_min	= 30;
					normal_probability_max	= 60;
				};
			};
		};
	};
};

unit_format:
{
	celsius		= "SI";
	meterspersecond	= "SI";
	millimeters	= "SI";
	percent		= "phrase";
};

querydata:
{
	pal_skandinavia_pintahistoria = "/usr/share/smartmet/test/data/pal/";
};

forecast_data:
{
	default_forecast = "use querydata.pal_skandinavia_pintahistoria";
};
